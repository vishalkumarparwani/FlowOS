<div style="background:#000; padding:2rem; border-radius:12px; font-family:sans-serif; max-width:640px;">
  <h1 style="color:#fff; font-size:22px; font-weight:700; margin:0 0 4px;">Settings</h1>
  <p style="color:#a1a1aa; font-size:13px; margin:0 0 24px;">Manage your account, preferences, and integrations.</p>

  <div style="display:flex; align-items:center; gap:14px; padding:16px; border:1px solid #27272a; border-radius:12px; background:#18181b4d; margin-bottom:20px;">
    <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#a855f7); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; color:#fff;">DEV</div>
    <div style="flex:1;">
      <p style="color:#f4f4f5; font-size:14px; font-weight:600; margin:0;">Vishal</p>
      <p style="color:#71717a; font-size:12px; margin:2px 0 0;">vishal@flowos.dev</p>
    </div>
    <button style="background:#18181b; border:1px solid #27272a; color:#a1a1aa; border-radius:8px; padding:7px 14px; font-size:12px; cursor:pointer;">Edit profile</button>
  </div>

  <div id="sections"></div>
</div>

<script>
const sections = [
  {
    title: "Preferences",
    rows: [
      { icon: "ti-moon", label: "Theme", desc: "Dark mode", type: "value" },
      { icon: "ti-bell", label: "Notifications", desc: "Task reminders and AI alerts", type: "toggle", on: true },
      { icon: "ti-language", label: "Language", desc: "English", type: "value" },
    ]
  },
  {
    title: "AI assistant",
    rows: [
      { icon: "ti-sparkles", label: "Auto-summarize notes", desc: "Summarize new notes automatically", type: "toggle", on: false },
      { icon: "ti-brain", label: "Model", desc: "Claude Sonnet", type: "value" },
    ]
  },
  {
    title: "Integrations",
    rows: [
      { icon: "ti-calendar", label: "Google Calendar", desc: "Not connected", type: "button", action: "Connect" },
      { icon: "ti-brand-github", label: "GitHub", desc: "Not connected", type: "button", action: "Connect" },
    ]
  },
  {
    title: "Account",
    rows: [
      { icon: "ti-lock", label: "Password", desc: "Last changed 3 months ago", type: "button", action: "Change" },
      { icon: "ti-trash", label: "Delete account", desc: "Permanently remove your data", type: "button", action: "Delete", danger: true },
    ]
  },
];

const container = document.getElementById('sections');

sections.forEach(sec => {
  const wrap = document.createElement('div');
  wrap.style.marginBottom = '20px';

  const heading = document.createElement('p');
  heading.textContent = sec.title;
  heading.style.cssText = 'color:#71717a; font-size:11px; text-transform:uppercase; font-weight:600; margin:0 0 8px;';
  wrap.appendChild(heading);

  const box = document.createElement('div');
  box.style.cssText = 'border:1px solid #27272a; border-radius:12px; overflow:hidden;';

  sec.rows.forEach((row, i) => {
    const rowEl = document.createElement('div');
    rowEl.style.cssText = `display:flex; align-items:center; gap:12px; padding:14px 16px; background:#18181b33; ${i !== sec.rows.length - 1 ? 'border-bottom:1px solid #27272a;' : ''}`;

    let control = '';
    if (row.type === 'toggle') {
      control = `<div style="width:36px; height:20px; border-radius:99px; background:${row.on ? '#4f46e5' : '#3f3f46'}; position:relative; cursor:pointer;">
        <div style="width:16px; height:16px; border-radius:50%; background:#fff; position:absolute; top:2px; left:${row.on ? '18px' : '2px'}; transition:left .15s;"></div>
      </div>`;
    } else if (row.type === 'button') {
      const color = row.danger ? '#f87171' : '#a1a1aa';
      const border = row.danger ? '#7f1d1d' : '#27272a';
      control = `<button style="background:#18181b; border:1px solid ${border}; color:${color}; border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer;">${row.action}</button>`;
    } else {
      control = `<span style="color:#71717a; font-size:12px;">${row.desc}</span>`;
    }

    rowEl.innerHTML = `
      <i class="ti ${row.icon}" style="font-size:16px; color:#a1a1aa;" aria-hidden="true"></i>
      <div style="flex:1;">
        <p style="color:#f4f4f5; font-size:13px; font-weight:500; margin:0;">${row.label}</p>
        ${row.type !== 'value' ? `<p style="color:#71717a; font-size:11px; margin:2px 0 0;">${row.desc}</p>` : ''}
      </div>
      ${control}
    `;
    box.appendChild(rowEl);
  });

  wrap.appendChild(box);
  container.appendChild(wrap);
});
</script>
